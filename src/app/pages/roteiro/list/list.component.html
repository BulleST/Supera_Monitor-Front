<p-toolbar styleClass="border-none bg-white p-3    ">
    <div class="p-toolbar-group-start flex-1">
        <h2 class="flex align-items-center ">
            <i class="bi bi-calendar-range mr-3 text-primary text-2xl"></i>
            <span class="text-xl font-normal">Roteiro Supera <span *ngIf="currentTitle" class="font-bold text-xl"> - {{currentTitle}}</span></span>
        </h2>
    </div>
    <div class="p-toolbar-group-end items-stretch">
        <p-button icon="pi pi-angle-left text-sm" (onClick)="prev()" severity="secondary" pTooltip="Próximo" class="mr-2" size="small" />
        <p-button icon="pi pi-angle-right text-sm" (onClick)="next()" severity="secondary" pTooltip="Anterior" class="mr-2" size="small" />
        <p-button (onClick)="today()" severity="secondary" pTooltip="Hoje" class="mr-2" size="small" label="hoje" styleClass="bg-black-alpha-50 text-white" />
        <p-button icon="pi pi-sync text-sm" (onClick)="update()" severity="secondary" label="atualizar" pTooltip="Atualizar roteiro" class="mr-2" size="small"  />
        <p-button icon="pi pi-plus text-sm" label="Cadastrar" [routerLink]="['cadastrar' ]" [rounded]="true" size="small" styleClass="px-3" />
    </div>
</p-toolbar>
<p-contextmenu #contextMenu [model]="items" appendTo="body" />
<full-calendar
               [options]="calendarioOptions"
               #fullCalendar
               class="p-1 "
               [ngStyle]="{height: '30rem'}">
    <ng-template #eventContent let-arg>
        <ng-container *ngIf="!loading; else loadingEvent">

            <ng-container *ngTemplateOutlet="eventoTemplate; context: { evento: arg.event.extendedProps, arg: arg }"></ng-container>
            <ng-template #eventoTemplate let-evento="evento" let-arg="arg">
                <ng-container *ngIf="evento.evento_Tipo_Id == EventoTipo.Feriado">
                    <div class="py-1">
                        <p class="text-xs">
                            <i class="pi pi-calendar mr-2 text-xs"></i>
                            <span>Feriado</span>
                        </p>
                        <p class="text-base font-bold">{{evento.descricao}}</p>
                        <p class="text-xs">{{evento.level}} - {{evento.type}}</p>
                    </div>
                </ng-container>
                <ng-container *ngIf="evento.evento_Tipo_Id != EventoTipo.Feriado">
                    <div class="py-1 cursor-pointer" 
                        (click)="edit(evento)" 
                        title="Clique para ver mais" >
                        <p class="text-sm">
                            <i class="pi pi-calendar mr-2 text-sm"></i>
                            <span>Semana {{evento.semana}}</span>
                        </p>
                        <p class="text-xl font-bold">{{evento.tema}}</p>
                    </div>
                </ng-container>
            </ng-template>
        </ng-container>
        <ng-template #loadingEvent>
            <p-skeleton width="100%" height="calc(3rem + 10vh)" />
        </ng-template>
    </ng-template>
</full-calendar>
<router-outlet></router-outlet>
