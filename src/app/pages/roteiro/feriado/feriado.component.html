<app-confirm-dialog></app-confirm-dialog>
<p-dialog [header]="isEditPage ? 'Editar feriado'  : 'Cadastrar feriado'"
          [maximizable]="true"
          [draggable]="true"
          [modal]="true"
          [(visible)]="visible"
          (visibleChange)="visibleChange()"
          [style]="{ width: '600px', maxWidth: '95vw', maxHeight: '95vh' }"
          appendTo="body">
    <ng-template #header>
        <div class="w-full flex align-items-center ">
            <span class="p-dialog-title">{{isEditPage ? 'Editar' : 'Cadastrar'}}</span>
        </div>
    </ng-template>
    <form (ngSubmit)="sendConfirmation(form, $event)" #form="ngForm">
        <div class="formgrid grid">
            <!-- Descricao -->
            <div class="field col-6">
                <label for="descricao">Descrição: <span class="text-red-500">*</span></label>
                <input type="text"
                       pInputText
                       #descricao="ngModel"
                       [(ngModel)]="object.descricao"
                       id="descricao"
                       name="descricao"
                       class="w-full"
                       [required]="true">
                <div *ngIf="descricao.touched && descricao.invalid && descricao.errors">
                    <p class="text-red-500 mt-2 mb-0" *ngIf="descricao.errors['required']">Esse campo é obrigatório.</p>
                </div>
            </div>
            <!-- Data -->
            <div class="field col-6">
                <label for="data">Data: <span class="text-red-500">*</span></label>
                <p-datepicker
                              #data="ngModel"
                              [(ngModel)]="object.data"
                              (ngModelChange)="validateDate(data)"
                              [showIcon]="true"
                              [iconDisplay]="'input'"
                              [selectOtherMonths]="true"
                              [disabledDates]="invalidDates"
                              [disabledDays]="[0]"
                              inputId="data"
                              name="data"
                              class="w-full"
                              styleClass="w-full"
                              inputStyleClass="w-full"
                              [required]="true"
                              appendTo="body" />
                <div *ngIf="data.touched && data.invalid && data.errors">
                    <p class="text-red-500 mt-2 mb-0" *ngIf="data.errors['required']">Esse campo é obrigatório.</p>
                    <p class="text-red-500 mt-2 mb-0" *ngIf="data.errors['invalid']">{{data.errors['invalid']}}</p>
                </div>
            </div>
            <!-- Legenda -->
            <div class="px-2 col-12"><p-divider layout="horizontal" /></div>
            <div class="field col-12 mt-2 ">
                <div class="flex align-items-center justify-content-start gap-2">
                    <label for="corLegenda">Legenda:</label>
                    <p-colorpicker [ngModel]="'#ff0000'" />
                    <span>Feriado</span>
                </div>
            </div>
            <div class="col-12 gap-2 flex flex-wrap align-items-center flex-wrap justify-content-between">
                <div class="col">
                    <p class="text-red-500" *ngIf="!error"><span class="text-red-500">*</span> Preencha os campos corretamente para salvar.</p>
                    <p class="text-red-500" *ngIf="error">{{error}}</p>
                </div>
                <div class="ml-auto flex align-items-center gap-2">
                    <p-button *ngIf="isEditPage"
                              type="button"
                              icon="pi pi-trash"
                              [rounded]="true"
                              severity="danger"
                              label="Excluir"
                              [loading]="loading"
                              [disabled]="loading"
                              (onClick)="excluirConfirmation($event)" />
                    <p-button
                              type="submit"
                              [disabled]="form.invalid || loading"
                              styleClass="px-3"
                              label="Salvar"
                              icon="pi pi-check"
                              [loading]="loading"
                              [rounded]="true" />
                </div>
            </div>
        </div>
    </form>
</p-dialog>
