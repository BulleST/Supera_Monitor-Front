<div class="flex align-items-center justify-content-center min-h-screen">
    <div class="lg:col-4 md:col-8 col-10 p-5 surface-50 border-round">
        <p class="text-3xl my-0">Account Verification</p>
        <ng-template [ngIf]="loading" [ngIfElse]="notLoading">
            <p class="mt-3 mb-1">Please, wait until we validate your account information.</p>
            <p class="mt-0 mb-3">Don't close this tab until the process is done.</p>
            <div class="flex align-items-center">
                <i class="pi pi-spin pi-spinner mr-3" style="font-size: 1.4rem"></i>
                <p>Loading...</p>
            </div>
        </ng-template>
        <ng-template #notLoading>
            <ng-template [ngIf]="error" [ngIfElse]="notError">
                <div class="flex align-items-center">
                    <i class="pi pi-times-circle text-2xl mr-3 text-red-500"></i>
                    <p class="mb-0" *ngIf="error" [innerHTML]="error"></p>
                    <p class="mb-0" *ngIf="!error" [innerHTML]="'An error ocurred while trying to verificate your account.'"></p>
                </div>
            </ng-template>
            <ng-template #notError>
                <div class="flex align-items-center">
                    <i class="pi pi-check-circle text-2xl mr-3 text-green-400"></i>
                    <p class="mb-0" *ngIf="success" [innerHTML]="success"></p>
                    <p class="mb-0" *ngIf="!success" [innerHTML]="'Verification completed successfully. Please, login.'"></p>
                </div>
            </ng-template>
            <p-divider />
            <p-button label="Go to login" severity="primary" size="small" [routerLink]="['../login']" />
        </ng-template>
    </div>
</div>
