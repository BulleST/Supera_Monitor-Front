<form #form="ngForm" (ngSubmit)="send()">
    <div class="formgrid grid">
        <div class="col-12 mb-4">
            <h3 class="text-2xl mb-0 font-bold">Login</h3>
            <p class="mb-0 mt-0">Insira e-mail e senha para acessar.</p>
        </div>
        <div class="field col-12"> <!-- E-mail -->
            <label for="email">E-mail: <span class="text-red-500">*</span></label>
            <div>
                <p-iconField iconPosition="left">
                    <p-inputIcon styleClass="pi pi-envelope" />
                    <input type="text"
                           pInputText
                           #email="ngModel"
                           [(ngModel)]="object.email"
                           id="email"
                           name="email"
                           class="w-full"
                           [required]="true"
                           placeholder="example@gmail.com">
                </p-iconField>
            </div>
            <div *ngIf="email.touched && email.invalid && email.errors">
                <p class="text-red-500 mt-2 mb-0" *ngIf="email.errors['required']">Esse campo é obrigatório.</p>
                <p class="text-red-500 mt-2 mb-0" *ngIf="email.errors['email']">E-mail inválido.</p>
                <p class="text-red-500 mt-2 mb-0" *ngIf="email.errors['pattern']">E-mail inválido.</p>
            </div>
        </div>
        <div class="field col-12"> <!-- Password -->
            <label for="password">Password: <span class="text-red-500">*</span></label>
            <div>
                <p-iconField iconPosition="left">
                    <p-inputIcon styleClass="pi pi-lock" />
                    <p-password [feedback]="false"
                                [toggleMask]="true"
                                #password="ngModel"
                                [(ngModel)]="object.password"
                                inputId="password"
                                name="password"
                                class="w-full"
                                styleClass="w-full"
                                inputStyleClass="w-full"
                                [required]="true"
                                placeholder="******" />
                </p-iconField>
            </div>
            <div *ngIf="password.touched && password.invalid && password.errors">
                <p class="text-red-500 mt-2 mb-0" *ngIf="password.errors['required']">Esse campo é obrigatório.</p>
            </div>
        </div>
        <div class="field col-12 mb-1 mt-4">
            <p class="text-red-500 mt-0 mb-2 text-center" *ngIf="error">{{error}}</p>
            <p-button
                      type="submit"
                      label="Entrar"
                      [rounded]="true"
                      [raised]="true"
                      class="w-full"
                      styleClass="w-full"
                      [disabled]="loading || form.invalid"
                      [loading]="loading" />
        </div>
    </div>
    <div class="col-12 text-center">
        <a class="text-primary link" [routerLink]="['..', 'forgot-password']">Esqueci minha senha</a>
    </div>
</form>
