<main class="surface-50 min-h-screen  ">
    <div style="background-image: url(/assets/images/account-bg-1.png);" class="home-bg bg-contain bg-no-repeat opacity-10 left-0 z-0 fixed top-0"></div>
    <div style="background-image: url(/assets/images/account-bg-2.png);" class="home-bg bg-contain bg-no-repeat opacity-10 -mb-5 fixed bottom-0 right-0 z-0"></div>
    <div style="background-image: url(/assets/images/account-bg-3.jpg); opacity: 0.06;" class="bg-cover bg-no-repeat z-0 w-full h-full fixed top-0 left-0 "></div>
    <div class="relative z-1 min-h-screen">
        <div>
            <app-header></app-header>
        </div>
        <div class="flex align-items-strech justify-content-between relative z-1 px-6">
            <div class="sticky pt-6 transition-linear transition-duration-100 transition-all top-0 mr-5"
                
                [ngStyle]="{ width: menuOpen ? '20rem' : '4rem' }">
                <app-nav-menu (menuOpen)="menuOpen = $event"></app-nav-menu>
            </div>
            <div class="bg-white shadow-1 border-round-md mt-6 flex-grow-1 flex-shrink-1 flex-1 overflow-x-auto"
            [ngStyle]="{ width: menuOpen ? '55%' : '80%' }">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</main>
