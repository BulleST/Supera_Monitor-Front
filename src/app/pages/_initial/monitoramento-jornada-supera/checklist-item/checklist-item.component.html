<p-accordion-panel [value]="index" #panel >
    <p-accordion-header>
        <div class="flex justify-content-between w-full -mt-1">
            <p>{{item.nome}}</p>
            <p class="font-normal px-2 white-space-nowrap" *ngIf="item.alunos">{{item.alunos.length}} alunos</p>
        </div>
    </p-accordion-header>
    <p-accordion-content>
        <p-table *ngIf="activeIndex == index" 
                [value]="item.alunos"
                 [scrollable]="true"
                 [scrollHeight]="'200px'"
                 [virtualScroll]="true"
                 [virtualScrollDelay]="100"
                 [virtualScrollItemSize]="55"
                 [virtualScrollOptions]="{  }"
                 stripedRows
                 tableStyleClass="checklist-item-alunos">
            <ng-template #body let-aluno let-index="rowIndex">
                <tr style="height: 55px;">
                    <td>
                        <app-checklist-item-aluno [item]="item" [alunoChecklistItem]="aluno"></app-checklist-item-aluno>
                    </td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <ng-container *ngIf="loading">
                    <tr *ngFor="let item of [1,2,3,4]"
                        style="height: 55px;">
                        <td [ngClass]="{
                                        'surface-100': item % 2 == 0,
                                        'surface-50': item % 2 != 0,
                                    }">
                            <div class="flex align-items-center mb-2 gap-2">
                                <p-skeleton size="1rem" shape="circle" />
                                <p-skeleton width="10rem" height="1rem" borderRadius="2rem" />
                            </div>
                            <div class="flex align-items-center gap-2">
                                <p-skeleton width="5rem" height="1rem" borderRadius="2rem" />
                                <p-skeleton width="5rem" height="1rem" borderRadius="2rem"
                                            class="ml-auto" />
                                <p-skeleton size="1rem" shape="circle" />
                            </div>
                        </td>
                    </tr>
                </ng-container>
                <ng-container *ngIf="!loading">
                    <tr style="height: 35px;">
                        <td class="text-500 py-0">Nenhum aluno nessa etapa</td>
                    </tr>
                </ng-container>
            </ng-template>
        </p-table> 
    </p-accordion-content>
</p-accordion-panel>
