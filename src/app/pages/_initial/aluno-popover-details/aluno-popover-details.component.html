            <div *ngIf="aluno.aluno_Foto" class="w-full h-full bg-cover	bg-center border-circle" [style]="{ backgroundImage: 'url(' + aluno.aluno_Foto + ')'}"></div>
        </div>
        <p-divider styleClass="mx-4 my-4" layout="vertical" />
        <div class=" flex flex-column py-3 gap-1">
            <div class="flex align-items-center">
                <p class="text-xl text-primary-500 font-bold">{{ aluno.nome }} </p>
            </div>
            <p><b>Turma: </b>{{ aluno.turma }} </p>
            <p *ngIf="aluno.apostila_Abaco">
                <b>Apostila Ábaco: </b>
                <span>{{ aluno.apostila_Abaco }}</span>
                <span> / </span>
                <b>Página: </b>
                <span>{{ aluno.numeroPaginaAbaco }}</span>
            </p>
            <p *ngIf="aluno.apostila_AH">
                <b>Apostila AH: </b>
                <span>{{ aluno.apostila_AH }}</span>
                <span> / </span>
                <b>Página: </b>
                <span>{{ aluno.numeroPaginaAH }}</span>
            </p>
            <ng-container *ngIf="showChecklist">
                <div class="gap-1 flex align-items-center" (click)="alunoChecklistComponent.show()">
                    <b>Jornada Supera: </b>
                    <app-aluno-popover-checklist #alunoChecklistComponent [aluno]="aluno"></app-aluno-popover-checklist>
                </div>
            </ng-container>
            <div class="flex align-items-center gap-2 mt-2 ">
                <p-button label="Editar aluno"
                          [rounded]="true"
                          icon="pi pi-user-edit"
                          styleClass="white-space-nowrap"
                          (onClick)="goToAluno(aluno)" />

                <a *ngIf="aluno.celular"
                   target="_blank"
                   rel="noopener noreferrer"
                   [href]="enviarMensagem(aluno.nome, aluno.celular)"
                   class="p-component p-ripple p-button p-button-success p-button-rounded  white-space-nowrap">
                    <span class="pi pi-whatsapp p-button-icon p-button-icon-left "></span>
                    <span class="p-button-label">Enviar mensagem</span>
                </a>
            </div>
        </div>
    </div>
</p-popover>
