<ng-container *ngIf="aluno">
    <div class="flex align-items-center gap-2 white-space-nowrap">
        <div *ngIf="atrasado">
            <!-- Atrasado -->
            <span pTooltip="Esse aluno está atrasado na jornada">
                <i class="pi pi-times-circle text-red-500 fadeout animation-duration-300 animation-iteration-infinite"></i>
            </span>
        </div>
        <div *ngIf="checklist && !atrasado" class="font-bold">
            <!-- Finalizado -->
            <i *ngIf="checklist.finalizados.length == checklist.items.length"
               pTooltip="Finalizado"
               class="pi pi-check-circle text-green-500"></i>
            <!-- Atrasado -->
            <span *ngIf="checklist.atrasados.length > 0 && checklist.finalizados.length < checklist.items.length"
                  pTooltip="Atrasado"> 
                  <span>{{checklist.finalizados.length}}/{{checklist.items.length}}</span> 
                  <i class="pi pi-times-circle text-red-500 fadeout animation-duration-300 animation-iteration-infinite"></i>
            </span>
            <!-- Pendentes da Semana -->
            <span *ngIf="checklist.pendentesDaSemana.length > 0 && checklist.finalizados.length < checklist.items.length"
                  pTooltip="Em andamento"> 
                  <span>{{checklist.finalizados.length}}/{{checklist.items.length}}</span> 
                  <i class="pi pi-exclamation-triangle text-orange-500"></i>
            </span>
        </div>
        <div *ngIf="loading" pTooltip="Carregando">
            <i class="pi pi-spin pi-spinner" style="font-size: 1rem"></i>
        </div>
        <span>{{checklist.nome }}</span>

    </div>
</ng-container>
