<p-popover #popover appendTo="body" styleClass="-mt-1 max-w-screen" [dismissable]="true">
    <div class="flex pl-2 pr-4">
        <div class="relative my-auto flex align-items-center justify-content-center border-circle overflow-hidden border-primary-500 border-1 w-9rem h-9rem p-1">
            <i class="pi pi-user text-xl" *ngIf="!aluno.aluno_Foto"></i>
            <div *ngIf="aluno.aluno_Foto" class="w-full h-full bg-cover	bg-center border-circle" [style]="{ backgroundImage: 'url(' + aluno.aluno_Foto + ')'}"></div>

        </div>
        <p-divider styleClass="mx-4 my-4" layout="vertical" />
        <div class=" flex flex-column py-3 gap-1">
            <div class="flex align-items-center">
                <p class="text-xl text-primary-500 font-bold">{{ aluno.aluno }} </p>
                <p-badge *ngIf="aluno.reposicaoDe_Evento_Id" value="Reposição" class="ml-2" styleClass="bg-purple-500" />
            </div>
            <p><b>Turma: </b>{{ aluno.turma }} </p>
            <p *ngIf="aluno.apostila_Abaco"><b>Apostila Ábaco: </b>{{ aluno.apostila_Abaco }} / <b>Página: </b>{{ aluno.numeroPaginaAbaco }}</p>
            <p *ngIf="aluno.apostila_AH"><b>Apostila AH: </b>{{ aluno.apostila_AH }} / <b>Página: </b>{{ aluno.numeroPaginaAH }}</p>
            
            <ng-container *ngIf="showChecklist">
                <div class="gap-1 flex align-items-center" (click)="alunoChecklistComponent.show()" >
                    <b>Jornada Supera: </b>
                    <app-aluno-checklist #alunoChecklistComponent [participacao]="aluno"></app-aluno-checklist>
                </div>
            </ng-container>
            
            <div class="flex align-items-center gap-2 mt-2 ">
                <p-button label="Ver aluno"
                          [rounded]="true"
                          icon="pi pi-user-edit"
                          styleClass="white-space-nowrap"
                          (onClick)="goToAluno(aluno)" />
                <ng-container *ngIf="[EventoTipo.Aula, EventoTipo.AulaExtra].includes(evento.evento_Tipo_Id) && (aluno.presente != true && evento.finalizado) || evento.finalizado == false">
                    <p-button
                              label="Agendar Reposição"
                              icon="pi pi-calendar"
                              [rounded]="true"
                              severity="secondary"
                              styleClass="white-space-nowrap"
                              (onClick)="goToReposicao(aluno)" />
                </ng-container>
                <a *ngIf="aluno.celular"
                   [href]="enviarMensagem(aluno.aluno, aluno.celular)"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="p-component p-ripple p-button p-button-success p-button-rounded  white-space-nowrap">
                    <span class="pi pi-whatsapp p-button-icon p-button-icon-left "></span>
                    <span class="p-button-label">Enviar mensagem</span>
                </a>
            </div>
        </div>
    </div>
</p-popover>
