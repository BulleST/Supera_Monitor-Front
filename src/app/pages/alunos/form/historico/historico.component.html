<p-table #dt
         [value]="list"
         stripedRows
         dataKey="id"
         sortField="data"
         sortMode="multiple"
         [sortOrder]="1"
         [loading]="loading"
         [showLoader]="false">
    <ng-template #header>
        <tr>
            <th>
                <p-button icon="pi pi-refresh text-white"
                          pTooltip="Atualizar"
                          tooltipPosition="bottom"
                          [text]="true"
                          severity="contrast"
                          (onClick)="update()" />
            </th>
            <th pSortableColumn="data">
                <div class="flex align-items-center gap-2">
                    <span>Data</span>
                    <p-sortIcon field="data" />
                </div>
            </th>
            <th pSortableColumn="descricao">
                <div class="flex align-items-center gap-2">
                    <span>Descrição</span>
                    <p-sortIcon field="descricao" />
                </div>
            </th>
            <th pSortableColumn="account">
                <div class="flex align-items-center gap-2">
                    <span>Usuário</span>
                    <p-sortIcon field="account" />
                </div>
            </th>
        </tr>
        <tr>
            <th></th>
            <th>
                <p-columnFilter
                                field="data"
                                type="date"
                                matchMode="dateIs"
                                class="p-column-filter-inline" />
            </th>
            <th>
                <p-columnFilter
                                field="descricao"
                                type="text"
                                matchMode="contains"
                                class="p-column-filter-inline" />
            </th>
            <th>
                <p-columnFilter
                                field="account"
                                type="text"
                                matchMode="contains"
                                class="p-column-filter-inline" />
            </th>
        </tr>
    </ng-template>
    <ng-template #body let-item let-rowIndex="rowIndex">
        <tr>
            <td class="text-300">{{rowIndex+1}}</td>
            <td class="w-min">
                <div class="flex align-items-center gap-2 white-space-nowrap">
                    <i class="pi pi-calendar"></i>
                    <span>{{item.data | date : 'dd/MM/yyyy HH:mm'}}</span>
                </div>
            </td>
            <td class="w-max">
                {{item.descricao}}
            </td>
            <td class="w-min">
                <div class="flex align-items-center gap-1 white-space-nowrap w-min">
                    <i class="pi pi-user"></i>
                    <span>{{item.account}}</span>
                </div>
            </td>
        </tr>
    </ng-template>
    <ng-template #emptymessage>
        <tr>
            <td colspan="4">Não há histórico desse aluno.</td>
        </tr>
    </ng-template>
    <ng-template #loadingbody>
        <tr *ngFor="let item of [1,2,3,4,5,6,7,8,9,0]">
            <td><p-skeleton /></td>
            <td><p-skeleton /></td>
            <td><p-skeleton /></td>
            <td><p-skeleton /></td>
        </tr>
    </ng-template>

</p-table>
