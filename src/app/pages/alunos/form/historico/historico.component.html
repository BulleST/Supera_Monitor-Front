<p-table #dt
         [value]="list"
         stripedRows
        dataKey="id"
        sortField="data"
         sortMode="multiple"
         [sortOrder]="1"
         [loading]="loading"
         [showLoader]="false" >
        <ng-template #header>
            <tr>
                <th pSortableColumn="data">
                    <div class="flex align-items-center gap-2">
                        <span>Data</span>
                        <p-sortIcon field="data" />
                    </div>
                </th>
                <th pSortableColumn="descricao">
                    <div class="flex align-items-center gap-2">
                        <span>Descrição</span>
                        <p-sortIcon field="descricao" />
                    </div>
                </th>
                <th pSortableColumn="account">
                    <div class="flex align-items-center gap-2">
                        <span>Usuário</span>
                        <p-sortIcon field="account" />
                    </div>
                </th>
            </tr>
            <tr>
                <th>
                    <p-columnFilter 
                        field="data"
                        type="date"
                        matchMode="dateIs"
                        class="p-column-filter-inline"/>
                </th>
                <th>
                    <p-columnFilter 
                        field="descricao"
                        type="text"
                        matchMode="contains"
                        class="p-column-filter-inline"/>
                </th>
                <th>
                    <p-columnFilter 
                        field="account"
                        type="text"
                        matchMode="contains"
                        class="p-column-filter-inline"/>
                </th>
            </tr>
        </ng-template>
    <ng-template #body let-item let-rowIndex="rowIndex">
        <tr>
            <td class="w-min">
                <div class="flex align-items-center gap-1 white-space-nowrap">
                    <i class="pi pi-clock"></i>
                    <span>{{item.data | date : 'dd/MM/yyyy HH:mm'}}</span>
                </div>
            </td>
            <td class="w-max">
                {{item.descricao}}
            </td>
            <td class="w-min">
                <div class="flex align-items-center gap-1 white-space-nowrap w-min">
                    <i class="pi pi-user"></i>
                    <span>{{item.account}}</span>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
