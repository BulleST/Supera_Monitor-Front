<app-confirm-dialog></app-confirm-dialog>
<p-dialog
          [maximizable]="true"
          [draggable]="true"
          [modal]="true"
          [(visible)]="visible"
          (visibleChange)="visibleChange()"
          [style]="{ width: '850px', maxWidth: '95vw', maxHeight: '95vh' }"
          appendTo="body"
          id="reposicao">
    <ng-template #header>
        <div class="w-full flex align-items-center ">
            <span class="p-dialog-title">
                <i class="pi pi-calendar mr-2 text-base w-2rem h-2rem p-2 border-circle bg-primary-500 text-white inline-flex align-items-center justify-content-center"></i>
                <span>Agendar reposição</span>
            </span>
        </div>
    </ng-template>
    <form #form="ngForm" class="px-2" (submit)="sendConfirmation(form, $event)">
        <div class="formgrid grid">
            <!-- Aluno -->
            <app-reposicao-aluno-select #reposicaoAlunoComponent
                              class="w-full flex"
                              [eventoReposicaoDe]="eventoReposicaoDe"
                              [eventoReposicaoPara]="eventoReposicaoPara"
                              (onAlunoChanged)="alunoChanged($event)"></app-reposicao-aluno-select>
            <!-- Reposição de Evento -->
            <app-reposicao-de-select
                                     #reposicaoDeComponent
                                     class="w-full flex"
                                     [aluno]="aluno"
                                     (onEventoChanged)="eventoReposicaoDeChanged($event)"></app-reposicao-de-select>
            <!-- Eventos Para -->
            <app-reposicao-para-select
                                       #reposicaoParaComponent
                                       class="w-full flex"
                                       [aluno]="aluno"
                                       (onEventoChanged)="eventoReposicaoParaChanged($event)"></app-reposicao-para-select>
                                       <!-- [eventoReposicaoDe]="eventoReposicaoDe" -->
         
            <div class="col-12 px-1 flex align-items-center justify-content-end">
                <p-button type="submit"
                          fluid
                          label="Finalizar agendamento"
                          icon="pi pi-check"
                          [loading]="loading"
                          [rounded]="true"
                          [disabled]="saveDisabled(form)" />
            </div>
        </div>
    </form>
</p-dialog>
