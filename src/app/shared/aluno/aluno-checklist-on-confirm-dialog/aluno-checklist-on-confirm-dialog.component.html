<p-dialog [modal]="true"
          [(visible)]="visible"
          (onHide)="onHide()"
          [style]="{ maxWidth: '95vw', width: '400px' }"
          appendTo="body"
          [draggable]="false"
          [maximizable]="false">
    <ng-template #header>
        <div class="w-full flex align-items-center ">
            <span class="p-dialog-title">
                <i
                   class="pi pi-check mr-2 text-base w-2rem h-2rem p-2 border-circle bg-primary-500 text-white inline-flex align-items-center justify-content-center"></i>
                <span>Finalizar Checklist</span>
            </span>
        </div>
    </ng-template>
    <form (ngSubmit)="send($event)">
        <div class="flex align-items-center gap-2">
            <p>Tem certeza que deseja marcar essa etapa como concluída?</p>
        </div>
        <div class="w-full flex-1 col-12 px-0">
            <p-iconfield>
                <p-inputicon styleClass="{{loading ? 'pi pi-spin pi-spinner' : 'pi pi-comment'}} p-iconfield-textarea" />
                <textarea pTextarea
                          class="w-full"
                          name="observacao"
                          id="observacao"
                          [(ngModel)]="observacao"
                          placeholder="Escreva aqui alguma observação..."
                          [rows]="2"
                          [disabled]="loading"></textarea>
            </p-iconfield>
        </div>
        <div class="w-full flex align-items-center justify-content-end gap-2">
            <ng-container *ngIf="[8,9,12,13,32,37,22,29,23].includes(alunoChecklistItem?.checklist_Item_Id ?? 0)">
                <ng-container *ngIf="celular">
                    <a [href]="enviarMensagemCondicao()"
                       target="_blank"
                       pTooltip="Enviar mensagem"
                       tooltipPosition="top"
                       [ngClass]="{'pointer-events-none': loading}">
                        <p-button icon="pi pi-whatsapp"
                                  label="Enviar mensagem"
                                  severity="success"
                                  [rounded]="true"
                                  [loading]="loading"
                                  [disabled]="loading" />
                    </a>
                </ng-container>
                <ng-container *ngIf="!celular">
                    <a pTooltip="Nenhum celular cadastrado"
                       tooltipPosition="top"
                       class="cursor-auto">
                        <p-button icon="pi pi-whatsapp"
                                  label="Enviar mensagem"
                                  severity="secondary"
                                  [rounded]="true"
                                  [disabled]="true" />
                    </a>
                </ng-container>
            </ng-container>
            <p-button type="button"
                      label="Ainda não"
                      icon="pi pi-times"
                      styleClass="w-full"
                      [outlined]="true"
                      [rounded]="true"
                      (onClick)="hide()"
                      [loading]="loading"
                      [disabled]="loading" />
            <p-button type="submit"
                      label="Finalizar"
                      icon="pi pi-check"
                      styleClass="w-full"
                      [rounded]="true"
                      [loading]="loading"
                      [disabled]="loading" />
        </div>
    </form>
</p-dialog>
