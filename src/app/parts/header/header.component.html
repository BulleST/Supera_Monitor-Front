<app-confirm-dialog></app-confirm-dialog>
<ng-container *ngIf="[ScreenWidth.sm].includes(screen); else elseTemplate">
    <div >
        <div class="navigation-container" [ngClass]="{ 'navigation-container-open': menuMobileOpen }">
            <div class="header header--mobile">
                <div class="flex align-items-center gap-2">
                    <p-button #menuButton
                              severity="primary"
                              icon="pi pi-bars"
                              (onClick)="toggleMenuMobile() "
                              size="large" />
                    <div class="flex align-items-center">
                        <img src="assets/images/logo-supera-white.png" class="w-6rem my-1" />
                    </div>
                </div>
            </div>
            <nav #navigation class="navigation">
                <ng-container *ngFor="let item of items">
                    <ng-container *ngIf="item.routerLink && item.routerLink.length; else elseTemplate">
                        <a pRipple [routerLink]="item.routerLink" [routerLinkActive]="item['routerLinkActive']" (click)="toggleMenuMobile()">
                            <ng-container *ngTemplateOutlet="navItem; context: { navItem: item }"></ng-container>
                        </a>
                    </ng-container>
                    <ng-template #elseTemplate>
                        <ng-container *ngTemplateOutlet="navItem; context: { navItem: item }"></ng-container>
                    </ng-template>
                    <ng-template #navItem let-navItem="navItem">
                        <span class="navigation-link white-space-nowrap flex align-items-center">
                            <div class="mr-2 w-2rem">
                                <fa-icon *ngIf="navItem.iconFontawesome" [icon]="navItem.iconFontawesome"></fa-icon>
                                <i *ngIf="navItem.icon" [class]="navItem.icon"></i>
                            </div>
                            <span>{{ navItem.label }}</span>
                            <p-badge *ngIf="navItem.badge" class="ml-auto" [value]="navItem.badge" />
                            <i *ngIf="navItem.items" [ngClass]="['ml-auto pi', 'pi-angle-down']"></i>
                        </span>
                    </ng-template>
                </ng-container>
                <div class="flex justify-content-center align-items-center  mt-auto "
                     [class.pr-3]="menuMobileOpen"
                     *ngIf="accountData">
                    <p-button *ngIf="menuMobileOpen"
                              pTooltip="Minha conta"
                              styleClass="flex align-items-center justify-content-start border-none w-full hover:bg-primary-600"
                              severity="primary"
                              [text]="true"
                              class="flex-1"
                              pRipple>
                        <span class="w-3rem h-3rem border-circle flex border-2 border-white flex-none">
                            <b class="m-auto flex text-sm text-white">{{accountData.abreviacao}}</b>
                        </span>
                        <span class="flex flex-column text-left text-white">
                            <span class="font-bold ">{{accountData.name}}</span>
                            <span class="text-sm ">{{accountData.email}}</span>
                        </span>
                    </p-button>
                    <p-button (onClick)="logout($event)"
                              severity="secondary"
                              pTooltip="Sair"
                              icon="pi pi-sign-out text-white"
                              size="small"
                              styleClass="ml-auto p-menu-item-icon w-full bg-black-alpha-80 border-900 text-white " />
                </div>
            </nav>
        </div>
    </div>
</ng-container>
<ng-template #elseTemplate>
    <header #header class="header">
        <div class="flex align-items-center">
            <img src="assets/images/logo-supera-white.png" class=" w-6rem my-1" />
        </div>
    </header>
</ng-template>
