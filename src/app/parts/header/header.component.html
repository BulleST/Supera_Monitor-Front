<app-confirm-dialog></app-confirm-dialog>
<ng-container *ngIf="[ScreenWidth.sm].includes(screen); else elseTemplate">
    <div>
        <div class="navigation-container" [ngClass]="{ 'navigation-container-open': menuMobileOpen }">
            <div class="navigation-container-background" (click)="toggleMenuMobile()"></div>
            <div class="header header--mobile">
                <div class="flex align-items-center ">
                    <p-button #menuButton
                              [severity]="menuMobileOpen ? 'contrast' : 'primary'"
                              icon="pi {{menuMobileOpen ? 'pi-times' : 'pi-bars'}} "
                              (onClick)="toggleMenuMobile() "
                              size="large" />

                    <div class="border-left-1 border-100 h-2rem w-1rem mx-1"></div>
                    <div class="flex align-items-center ">
                        <img src="assets/images/logo-supera-white.png" class="w-6rem my-1" />
                    </div>
                </div>
            </div>
            <nav #navigation class="navigation ">
                <p-menu [model]="items"
                        styleClass="border-none border-round-md min-w-0 ">
                    <ng-template #submenuheader let-item>
                        <div class="flex align-items-center px-1" style="height: 1rem">
                            <span class="text-primary font-bold">{{ item.label }}</span>
                        </div>
                    </ng-template>
                    <ng-template #item let-item>
                        <a pRipple
                           [routerLink]="item.routerLink"
                           [routerLinkActive]="item.routerLinkActive"
                           (click)="toggleMenuMobile()"
                           class="p-menu-item-link flex align-items-center justify-content-center" [pTooltip]="item.pTooltip">
                            <span class="p-menu-item-icon">
                                <ng-template [ngIf]="item.iconImage">
                                    <img src="./../../.assets/images/{{item.iconImage}}" alt="{{item.iconImage}}">
                                </ng-template>
                                <ng-template [ngIf]="item.icon">
                                    <i *ngIf="item.icon" [class]="item.icon"></i>
                                </ng-template>
                                <ng-template [ngIf]="item.iconFontawesome">
                                    <fa-icon [icon]="item.iconFontawesome"></fa-icon>
                                </ng-template>
                            </span>
                            <span class="ml-2 mr-auto">{{ item.label }}</span>
                            <p-badge *ngIf="item.badge" class="ml-auto" [value]="item.badge" />
                            <span *ngIf="item.shortcut" class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1"> {{ item.shortcut }} </span>
                        </a>
                    </ng-template>
                    <ng-template #end>
                        <ng-container *ngIf="accountData">
                            <div class="flex justify-content-center align-items-center pr-3 pb-3">
                                <p-button
                                          pTooltip="Minha conta"
                                          styleClass="flex align-items-center justify-content-start border-none w-full"
                                          severity="secondary"
                                          [text]="true"
                                          class="flex-1"
                                          pRipple>
                                    <span class="w-3rem h-3rem border-circle flex border-2 border-200 flex-none">
                                        <b class="m-auto flex text-sm text-primary">{{accountData.abreviacao}}</b>
                                    </span>
                                    <span class="flex flex-column text-left">
                                        <span class="font-bold ">{{accountData.name}}</span>
                                        <span class="text-sm ">{{accountData.email}}</span>
                                    </span>
                                </p-button>
                                <p-button (onClick)="logout($event)"
                                          severity="secondary"
                                          pTooltip="Sair da conta"
                                          tooltipPosition="top"
                                          label="Sair"
                                          icon="pi pi-sign-out text-white"
                                          styleClass="ml-auto p-menu-item-icon w-full bg-black-alpha-80 hover:bg-black-alpha-60 border-none text-white" />
                            </div>
                        </ng-container>
                    </ng-template>
                </p-menu>
            </nav>
        </div>
    </div>
</ng-container>
<ng-template #elseTemplate>
    <!-- <header #header class="header">
        <div class="flex align-items-center">
            <img src="assets/images/logo-supera-white.png" class=" w-6rem my-1" />
        </div>
    </header> -->
</ng-template>
