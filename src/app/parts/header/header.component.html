
    <p-menubar #menuBar 
        [model]="[ ScreenWidth.sm].includes(screen) ? items : []  "  
        styleClass="w-full h-5rem bg-primary-500 border-none shadow-1 border-noround p-2 px-6 flex align-items-center justify-content-between  ">
        <ng-template #start>
            <div class="flex align-items-center">
                <img src="assets/images/logo-supera-white.png" class=" w-6rem my-1" />
            </div>
        </ng-template>
        <ng-template #item let-item let-root="root">
            <a pRipple class="flex items-center p-menubar-item-link">
                <span>{{ item.label }}</span>
                <p-badge *ngIf="item.badge" [ngClass]="{ 'ml-auto': !root, 'ml-2': root }" [value]="item.badge" />
                <span *ngIf="item.shortcut" class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">{{ item.shortcut }}</span>
                <i *ngIf="item.items" [ngClass]="['ml-auto pi', root ? 'pi-angle-down' : 'pi-angle-right']"></i>
            </a>
        </ng-template>
        <ng-template #end>
            <p-button *ngIf="[ ScreenWidth.sm].includes(screen)" 
            
                severity="primary"  
                #menuButton
                class="ml-auto "
                [rounded]="true"
                icon="pi pi-bars"
                (onClick)="menuBar.toggle($event); " />
        
        </ng-template>
    </p-menubar>
