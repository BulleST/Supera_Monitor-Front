<app-confirm-dialog></app-confirm-dialog>
<p-menu [model]="items"
        styleClass="border-none bg-white shadow-1  border-round-md min-w-0 ">
    <ng-template #start>
        <div class="px-3 pt-3 flex align-items-center justify-content-center">
            <img *ngIf="menuOpen" src="assets/images/logo-supera.png" alt="Logo Supera" class="w-6rem mr-2">
            <p-button severity="primary"
                      class="ml-auto "
                      [class.-mb-4]="menuOpen"
                      [rounded]="true"
                      icon="pi pi-bars"
                      (onClick)="setMenu()" />
        </div>
    </ng-template>
    <ng-template #submenuheader let-item>
        <div class="flex align-items-center px-1" style="height: 1rem">
            <p-divider *ngIf="!menuOpen" layout="horizontal" styleClass="m-0 p-0 border-primary-500"></p-divider>
            <span class="text-primary font-bold" *ngIf="menuOpen">{{ item.label }}</span>
        </div>
    </ng-template>
    <ng-template #item let-item>
        <a pRipple [routerLink]="item.routerLink" [routerLinkActive]="item.routerLinkActive"
           class="p-menu-item-link flex align-items-center justify-content-center" [pTooltip]="item.pTooltip">
            <span class="p-menu-item-icon">
                <ng-template [ngIf]="item.iconImage">
                    <img src="./../../.assets/images/{{item.iconImage}}" alt="{{item.iconImage}}">
                </ng-template>
                <ng-template [ngIf]="item.icon">
                    <i *ngIf="item.icon" [class]="item.icon"></i>
                </ng-template>
                <ng-template [ngIf]="item.iconFontawesome">
                    <fa-icon [icon]="item.iconFontawesome"></fa-icon>
                </ng-template>
            </span>
            <span class="ml-2 mr-auto" *ngIf="menuOpen">{{ item.label }}</span>
            <p-badge *ngIf="item.badge" class="ml-auto" [value]="item.badge" />
            <span *ngIf="item.shortcut" class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1"> {{ item.shortcut }} </span>
        </a>
    </ng-template>
    <ng-template #end>
        <ng-container *ngIf="account?.id == 1">
            <div class="px-2">

                <p-select
                    [options]="options"
                    [ngModel]="options[1]"
                    optionLabel="label"
                    optionValue="value"
                    (onChange)="urlChange($event)"
                    appendTo="body"
                    fluid
                />
            </div>
        </ng-container>
        <div class="flex justify-content-center align-items-center  pb-3"
             [class.pr-3]="menuOpen"
             *ngIf="accountData">
            <p-button *ngIf="menuOpen"
                      pTooltip="Minha conta"
                      styleClass="flex align-items-center justify-content-start border-none w-full"
                      severity="secondary"
                      [text]="true"
                      class="flex-1"
                      pRipple>
                <span class="w-3rem h-3rem border-circle flex border-2 border-200 flex-none">
                    <b class="m-auto flex text-sm text-primary">{{accountData.abreviacao}}</b>
                </span>
                <span class="flex flex-column text-left">
                    <span class="font-bold ">{{accountData.name}}</span>
                    <span class="text-sm ">{{accountData.email}}</span>
                </span>
            </p-button>
            <p-button (onClick)="logout($event)"
                      severity="secondary"
                      pTooltip="Sair da conta"
                      tooltipPosition="top"
                      [label]="menuOpen ? 'Sair' : undefined"
                      icon="pi pi-sign-out text-white"
                      [rounded]="menuOpen"
                      size="small"
                      styleClass="ml-auto p-menu-item-icon w-full bg-black-alpha-80 hover:bg-black-alpha-60 border-none text-white {{menuOpen ? 'px-3' : ''}}" />
        </div>
    </ng-template>
</p-menu>
